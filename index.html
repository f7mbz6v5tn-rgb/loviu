<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Particle Heart</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background-color: #000;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;

            width: 100vw;
            height: 100vh;

            touch-action: none;
        }

        .instruction {
            position: fixed;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            color: rgba(255, 255, 255, 0.5);

            font-family: Arial, sans-serif;

            font-size: 18px;

            letter-spacing: 2px;

            pointer-events: none;

            text-align: center;

            z-index: 10;
        }

        .instruction span {
            display: inline-block;

            margin-top: 10px;

            animation:
                softBlink
                2s
                ease-in-out
                infinite;

            text-shadow:
                0 0 8px
                rgba(255, 255, 255, 0.7);
        }

        @keyframes softBlink {

            0%, 100% {
                opacity: 0.4;
            }

            50% {
                opacity: 1;
            }

        }

        @media (max-width: 600px) {

            .instruction {
                font-size: 16px;
                letter-spacing: 1.5px;
            }

            .instruction span {
                margin-top: 8px;
            }

        }

    </style>

</head>


<body>

    <canvas id="heartCanvas"></canvas>


    <div class="instruction">

        You are my person ❤️

        <br>

        <span>
            (Click or Touch)
        </span>

    </div>


    <script>

        const canvas =
            document.getElementById("heartCanvas");

        const ctx =
            canvas.getContext("2d");


        let particles = [];

        let currentHue =
            Math.random() * 360;



        // =====================================
        // AJUSTAR CANVAS
        // =====================================

        function resizeCanvas() {

            const pixelRatio =
                Math.min(
                    window.devicePixelRatio || 1,
                    2
                );


            canvas.width =
                window.innerWidth * pixelRatio;

            canvas.height =
                window.innerHeight * pixelRatio;


            canvas.style.width =
                window.innerWidth + "px";

            canvas.style.height =
                window.innerHeight + "px";


            ctx.setTransform(
                pixelRatio,
                0,
                0,
                pixelRatio,
                0,
                0
            );

        }


        resizeCanvas();


        window.addEventListener(
            "resize",
            resizeCanvas
        );



        // =====================================
        // PARTÍCULA
        // =====================================

        class Particle {

            constructor(
                x,
                y,
                targetX,
                targetY,
                hue
            ) {

                this.x = x;

                this.y = y;

                this.targetX =
                    targetX;

                this.targetY =
                    targetY;


                this.size =
                    Math.random() * 3 + 1;


                this.speed =
                    Math.random() * 0.08 + 0.04;


                this.alpha = 1;


                this.color =
                    `hsl(${hue}, 100%, 65%)`;

            }


            update() {

                this.x +=
                    (
                        this.targetX -
                        this.x
                    ) *
                    this.speed;


                this.y +=
                    (
                        this.targetY -
                        this.y
                    ) *
                    this.speed;


                this.alpha -= 0.006;

            }


            draw() {

                ctx.save();


                ctx.globalAlpha =
                    this.alpha;


                ctx.fillStyle =
                    this.color;


                ctx.shadowBlur = 15;


                ctx.shadowColor =
                    this.color;


                ctx.beginPath();


                ctx.arc(

                    this.x,

                    this.y,

                    this.size,

                    0,

                    Math.PI * 2

                );


                ctx.fill();


                ctx.restore();

            }

        }



        // =====================================
        // FORMA DEL CORAZÓN
        // =====================================

        function getHeartPoint(
            t,
            scale
        ) {

            const x =
                16 *
                Math.pow(
                    Math.sin(t),
                    3
                );


            const y =
                13 *
                Math.cos(t)
                -
                5 *
                Math.cos(2 * t)
                -
                2 *
                Math.cos(3 * t)
                -
                Math.cos(4 * t);


            return {

                x: x * scale,

                y: -y * scale

            };

        }



        // =====================================
        // CREAR CORAZÓN
        // =====================================

        function createHeart(
            startX,
            startY
        ) {

            particles = [];


            currentHue =
                (currentHue + 60) % 360;


            const scale =
                Math.min(
                    window.innerWidth,
                    window.innerHeight
                ) *
                0.014;


            for (
                let t = 0;
                t < Math.PI * 2;
                t += 0.045
            ) {

                const heartPoint =
                    getHeartPoint(
                        t,
                        scale
                    );


                const randomX =
                    (
                        Math.random() - 0.5
                    ) * 4;


                const randomY =
                    (
                        Math.random() - 0.5
                    ) * 4;


                const targetX =
                    startX +
                    heartPoint.x +
                    randomX;


                const targetY =
                    startY +
                    heartPoint.y +
                    randomY;


                particles.push(

                    new Particle(

                        startX,

                        startY,

                        targetX,

                        targetY,

                        currentHue

                    )

                );

            }

        }



        // =====================================
        // CLICK EN COMPUTADORA
        // =====================================

        window.addEventListener(
            "click",
            function(event) {

                createHeart(

                    event.clientX,

                    event.clientY

                );

            }
        );



        // =====================================
        // TOUCH EN TELÉFONO
        // =====================================

        window.addEventListener(
            "touchstart",
            function(event) {

                event.preventDefault();


                const touch =
                    event.touches[0];


                if (!touch) {
                    return;
                }


                createHeart(

                    touch.clientX,

                    touch.clientY

                );

            },
            {
                passive: false
            }
        );



        // =====================================
        // ANIMACIÓN
        // =====================================

        function animate() {


            ctx.fillStyle =
                "rgba(0, 0, 0, 0.18)";


            ctx.fillRect(

                0,

                0,

                window.innerWidth,

                window.innerHeight

            );


            for (
                let i =
                    particles.length - 1;

                i >= 0;

                i--
            ) {

                const particle =
                    particles[i];


                particle.update();


                particle.draw();


                if (
                    particle.alpha <= 0
                ) {

                    particles.splice(
                        i,
                        1
                    );

                }

            }


            requestAnimationFrame(
                animate
            );

        }


        animate();

    </script>

</body>

</html>
